<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="header">
        <h1>SKOT Artist Page</h1>
        <div class="nav-buttons">
            <a href="{{ url_for('stats') }}">Stats</a>
            <a href="{{ url_for('upload') }}">Upload</a>
        </div>
    </div>

    <h1>{{ current_user.username }} statistics</h1>

    <!-- Graphique récapitulatif des 7 derniers jours -->
        <div class="chart-item summary-chart-container">
        <h2>Listens in the Last 7 Days</h2>
        <canvas id="summary-chart" class="summary-chart"></canvas>
        <script>
            const summaryCtx = document.getElementById('summary-chart').getContext('2d');
            const summaryData = {
                labels: [],
                datasets: []
            };
    
            const now = new Date();
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(now.getDate() - 7);
    
            // Initialiser les dates des 7 derniers jours
            for (let d = new Date(sevenDaysAgo); d <= now; d.setDate(d.getDate() + 1)) {
                const day = d.toISOString().split('T')[0];
                summaryData.labels.push(day);
            }
    
            // Couleurs pour les courbes
            const colors = [
                'rgba(75, 192, 192, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(255, 206, 86, 1)',
                'rgba(153, 102, 255, 1)',
                'rgba(255, 159, 64, 1)',
                'rgba(255, 99, 132, 1)',
                'rgba(255, 99, 71, 1)',
                'rgba(60, 179, 113, 1)',
                'rgba(255, 140, 0, 1)',
                'rgba(138, 43, 226, 1)',
                'rgba(0, 128, 128, 1)',
                'rgba(255, 215, 0, 1)',
                'rgba(0, 191, 255, 1)',
                'rgba(255, 20, 147, 1)',
                'rgba(34, 139, 34, 1)',
                'rgba(218, 112, 214, 1)',
                'rgba(210, 105, 30, 1)',
                'rgba(0, 255, 127, 1)',
                'rgba(70, 130, 180, 1)',
                'rgba(255, 69, 0, 1)'
            ];
    
            // Compter les écoutes pour chaque chanson et chaque jour
            {% for key, timestamps in stats.items() %}
                (function() {
                    const timestamps{{ loop.index }} = {{ timestamps|tojson }};
                    const counts{{ loop.index }} = {};
    
                    // Initialiser les comptes pour chaque jour
                    for (let d = new Date(sevenDaysAgo); d <= now; d.setDate(d.getDate() + 1)) {
                        const day = d.toISOString().split('T')[0];
                        counts{{ loop.index }}[day] = 0;
                    }
    
                    timestamps{{ loop.index }}.forEach(timestamp => {
                        const date = new Date(timestamp);
                        const day = date.toISOString().split('T')[0];
                        if (day in counts{{ loop.index }}) {
                            counts{{ loop.index }}[day] += 1;
                        }
                    });
    
                    const dataPoints = [];
                    let totalListens = 0;
                    for (const day of summaryData.labels) {
                        const count = counts{{ loop.index }}[day];
                        dataPoints.push(count);
                        totalListens += count;
                    }
    
                    // Ajouter au dataset seulement si la chanson a des écoutes
                    if (totalListens > 0) {
                        summaryData.datasets.push({
                            label: '{{ key }}',
                            data: dataPoints,
                            backgroundColor: colors[{{ loop.index0 }} % colors.length],
                            borderColor: colors[{{ loop.index0 }} % colors.length],
                            borderWidth: 1,
                            fill: false,
                            pointBackgroundColor: colors[{{ loop.index0 }} % colors.length],
                            pointBorderColor: colors[{{ loop.index0 }} % colors.length],
                            pointRadius: 5,
                            pointStyle: 'circle' // Style des points
                        });
                    }
                })();
            {% endfor %}
    
            new Chart(summaryCtx, {
                type: 'line',
                data: summaryData,
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                usePointStyle: true // Utiliser le style des points dans la légende
                            }
                        }
                    }
                }
            });
        </script>
    </div>

    <h2>Statistics for each songs:</h2>

    <div class="chart-container">
        {% for key, timestamps in stats.items() %}
        <div class="chart-item">
            <h2>{{ key }} (Total listens: {{ timestamps|length }})</h2>
            <canvas id="chart-{{ loop.index }}"></canvas>
            <script>
                (function() {
                    const ctx{{ loop.index }} = document.getElementById('chart-{{ loop.index }}').getContext('2d');
                    const data{{ loop.index }} = {
                        labels: [],
                        datasets: [{
                            label: 'Number of listens per day',
                            data: [],
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1,
                            fill: false,
                            pointBackgroundColor: 'rgba(75, 192, 192, 1)',
                            pointBorderColor: 'rgba(75, 192, 192, 1)',
                            pointRadius: 5,
                            pointStyle: 'circle' // Style des points
                        }]
                    };

                    const timestamps{{ loop.index }} = {{ timestamps|tojson }};
                    const counts{{ loop.index }} = {};

                    timestamps{{ loop.index }}.forEach(timestamp => {
                        const date = new Date(timestamp);
                        const day = date.toISOString().split('T')[0]; // Obtenir la date au format YYYY-MM-DD
                        counts{{ loop.index }}[day] = (counts{{ loop.index }}[day] || 0) + 1;
                    });

                    for (const [day, count] of Object.entries(counts{{ loop.index }})) {
                        data{{ loop.index }}.labels.push(day);
                        data{{ loop.index }}.datasets[0].data.push(count);
                    }

                    new Chart(ctx{{ loop.index }}, {
                        type: 'line',
                        data: data{{ loop.index }},
                        options: {
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            },
                            plugins: {
                                legend: {
                                    labels: {
                                        usePointStyle: true // Utiliser le style des points dans la légende
                                    }
                                }
                            }
                        }
                    });
                })();
            </script>
        </div>
        {% endfor %}
    </div>
</body>
</html>
